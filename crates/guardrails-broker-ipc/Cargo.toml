[package]
name = "guardrails-broker-ipc"
version = "0.1.0"
description = "Authenticated local IPC protocol for GuardRails IDE brokers"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
guardrails-fs-broker = { path = "../guardrails-fs-broker" }
guardrails-policy = { path = "../guardrails-policy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
