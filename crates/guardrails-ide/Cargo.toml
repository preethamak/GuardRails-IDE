[package]
name = "guardrails-ide"
version = "0.1.0"
description = "Installable local GuardRails IDE application"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = "0.8"
guardrails-fs-broker = { path = "../guardrails-fs-broker" }
guardrails-policy = { path = "../guardrails-policy" }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["set-header", "trace"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
